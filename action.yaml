name: raviqqe/pnpm-publish
description: pnpm publish as a GitHub Action
branding:
  icon: book
  color: orange
inputs:
  build_script:
    description: A build script
    required: false
    default: build
  directory:
    description: A directory where a `pnpm-workspace.yaml` file exists
    required: false
    default: .
  release:
    description: A flag to release packages
    required: false
outputs: {}
runs:
  using: composite
  steps:
    - run: pnpm i --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.directory }}
    - run: pnpm -r --if-present ${{ inputs.build_script }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      if: inputs.build_script
    - run: >
        pnpm -r publish --access public --report-summary
        ${{ inputs.release != 'true' && '--dry-run --no-git-checks' || '' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
    - run: |
        jq -r '.publishedPackages[] | "\(.name) \(.version)"' pnpm-publish-summary.json |
          while read -r name version; do
            echo "Waiting for $name@$version in the registry..."

            until [ "$(pnpm view "$name@$version" version 2> /dev/null)" = "$version" ]; do
              if [ "$SECONDS" -gt 1800 ]; then
                echo "$name@$version is not available in the registry." >&2
                exit 1
              fi

              sleep 10
            done
          done
      shell: bash
      working-directory: ${{ inputs.directory }}
      if: inputs.release == 'true'
